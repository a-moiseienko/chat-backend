spring:
  application:
    name: chat-backend
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

chat:
  # Origins that may call /api from a browser (comma separated).
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
