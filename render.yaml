databases:
  - name: chat-db
    databaseName: chat
    user: chat
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: chat-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: CHAT_ALLOWED_ORIGINS
        value: https://chat-widget-2r2b.onrender.com
      - key: PGHOST
        fromDatabase:
          name: chat-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: chat-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: chat-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: chat-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: chat-db
          property: password

# Schema (including `CREATE EXTENSION vector`) is applied by chat-backend itself on startup via
# Spring Boot's embedded Flyway (src/main/resources/db/migration) against this same database.
